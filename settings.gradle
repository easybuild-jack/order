rootProject.name = 'order'

dependencyResolutionManagement.versionCatalogs {
    libs {
        library("dependencies", "com.mcst:easyfk-dependencies:3.5.16")
        library("moduleDependencies", "com.mcst:module-dependencies:3.5.16")
        // lombok 的版本已由 easyfk-dependencies BOM（bundle 'base'）统一托管，此处不再单独声明
        library('lombokMapstruct', 'org.projectlombok:lombok-mapstruct-binding:0.2.0')
        library('mapstructProcessor', 'io.github.linpeilie:mapstruct-plus-processor:1.5.3')
        library('processor', 'org.springframework.boot:spring-boot-configuration-processor:3.5.16')
    }
}


include 'order-server'
include 'order-api'

include 'order-orm'
include 'order-orm:order-orm-api'
findProject(':order-orm:order-orm-api')?.name = 'order-orm-api'
include 'order-orm:order-orm-plus'
findProject(':order-orm:order-orm-plus')?.name = 'order-orm-plus'
include 'order-orm:order-orm-flex'
findProject(':order-orm:order-orm-flex')?.name = 'order-orm-flex'
include 'order-orm:order-orm-hibernate'
findProject(':order-orm:order-orm-hibernate')?.name = 'order-orm-hibernate'

include 'order-remote'
include 'order-remote:order-cloud-api'
findProject(':order-remote:order-cloud-api')?.name = 'order-cloud-api'
include 'order-remote:order-cloud-provider'
findProject(':order-remote:order-cloud-provider')?.name = 'order-cloud-provider'

include 'order-remote:order-dubbo-api'
findProject(':order-remote:order-dubbo-api')?.name = 'order-dubbo-api'
include 'order-remote:order-dubbo-provider'
findProject(':order-remote:order-dubbo-provider')?.name = 'order-dubbo-provider'


include 'order-prd'
include 'order-prd:order-prd-client'
findProject(':order-prd:order-prd-client')?.name = 'order-prd-client'
include 'order-prd:order-prd-bms'
findProject(':order-prd:order-prd-bms')?.name = 'order-prd-bms'
